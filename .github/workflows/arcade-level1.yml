name: MIG-2 Arcade Committed Level 1
on:
  push:
    paths:
      - '.github/workflows/arcade-level1.yml'
      - 'godot/**'
      - 'apps/arcade-web/**'
      - 'packages/arcade-*/**'
      - 'assets/arcade/**'
      - 'config/arcade*.json'
      - 'docs/arcade/**'
      - 'docs/migration/**'
      - 'packages/mad-buds-kush-krusher/**'
  pull_request:
permissions:
  contents: read
jobs:
  arcade-level1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm game tree and original animation assets
        run: |
          test -f godot/project.godot
          test -f godot/tests/test_animation_assets.gd
          test -f config/arcade-game-identities.json
          test "$(find godot -name '*.png' | wc -l)" -ge 100
          test "$(find assets/arcade -name '*.png' | wc -l)" -ge 300
      - name: Obtain Godot 4.4.1 headless
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.4.1-stable_linux.x86_64
      - name: Godot project import and gameplay contract
        run: |
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --editor --quit
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://tests/test_animation_assets.gd
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://tests/test_kush_contract.gd
          /tmp/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot --script res://tests/test_mb3_level2.gd
      - name: Arcade web baseline
        working-directory: apps/arcade-web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
